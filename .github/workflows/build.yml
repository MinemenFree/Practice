# Builds the plugin jar on every push / PR and uploads it as a downloadable artifact.
# See https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -T 2C
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
          name: cPractice
          path: target/*.jar
          if-no-files-found: error
